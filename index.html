<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Live Radio</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #222; padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 280px;}
        button { padding: 10px 20px; margin: 5px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; }
        .skip-btn { background: #ff4757; color: white; width: 100%; margin-top: 15px; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="card">
    <h2>Live Radio Player</h2>
    <p>Streaming from AWS & Telegram</p>
    
    <div>
        <button id="play-btn" style="background: #2ed573; color: white;">PLAY</button>
        <button id="pause-btn" style="background: #ffa502; color: white;">PAUSE</button>
    </div>
    
    <button id="skip-btn" class="skip-btn">⏭️ VOTE TO SKIP</button>
    <div id="status">Stopped</div>
</div>

<script>
// 🌟 FIX: Add "raadio." and "/radio.mp3" to the string values
const AUDIO_BASE = "https://raadio.run.place";
const API_BASE   = "https://raadio.run.place";


    const audioPlayer = new Audio();
    audioPlayer.crossOrigin = "anonymous";
    const statusDiv = document.getElementById('status');

    function syncStream() {
        const wasPlaying = !audioPlayer.paused;
        // 🌟 FIX: Clean query parameter concatenation string building layout
        audioPlayer.src = AUDIO_BASE + "?timestamp=" + Date.now();
        audioPlayer.load();
        if (wasPlaying) {
            setTimeout(() => { audioPlayer.play().catch(e => console.log("Buffering...")); }, 600);
        }
    }

    document.getElementById('play-btn').addEventListener('click', () => {
        statusDiv.innerText = "Connecting to live radio...";
        audioPlayer.src = AUDIO_BASE + "?timestamp=" + Date.now();
        audioPlayer.play()
            .then(() => { statusDiv.innerText = "Playing Live Stream..."; })
            .catch(err => { statusDiv.innerText = "Click PLAY again to stream."; });
    });

    document.getElementById('pause-btn').addEventListener('click', () => {
        audioPlayer.pause();
        statusDiv.innerText = "Paused.";
    });

    document.getElementById('skip-btn').addEventListener('click', async () => {
        statusDiv.innerText = "Voting to skip...";
        try {
            const response = await fetch(API_BASE, { method: 'POST' });
            const data = await response.json();
            statusDiv.innerText = data.message;

            if (data.status === "success" || data.message.includes("globally")) {
                syncStream();
            }
        } catch (err) {
            statusDiv.innerText = "Error hitting skip server.";
            console.error(err);
        }
    });

    audioPlayer.addEventListener('stalled', syncStream);
    audioPlayer.addEventListener('error', syncStream);
</script>

</body>
</html>
