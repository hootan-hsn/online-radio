  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Share+Tech+Mono&display=swap" rel="stylesheet">

</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>

  <main class="stage">
    <article class="deck" id="player">
      <header class="brand">
        <div class="mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" class="flamingo" width="100%" height="100%">
            <defs>
              <filter id="logo-vintageSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="-6" dy="-6" stdDeviation="10" flood-color="#FFFFFF" flood-opacity="0.9"/>
                <feDropShadow dx="12" dy="12" stdDeviation="15" flood-color="#D1CBB7" flood-opacity="0.5"/>
              </filter>
              <linearGradient id="logo-goldTubeGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFE6A3"/>
                <stop offset="0.55" stop-color="#EBB344"/>
                <stop offset="1" stop-color="#C28723"/>
              </linearGradient>
              <linearGradient id="logo-goldNeckGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#FFF2CC"/>
                <stop offset="0.5" stop-color="#F2BE54"/>
                <stop offset="1" stop-color="#D4992C"/>
              </linearGradient>
              <linearGradient id="logo-vintageCharcoal" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#46423B"/>
                <stop offset="100%" stop-color="#262420"/>
              </linearGradient>
              <linearGradient id="logo-beakCream" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFFBF2"/>
                <stop offset="1" stop-color="#E6DCBF"/>
              </linearGradient>
              <clipPath id="logo-tubeClip">
                <ellipse cx="310" cy="435" rx="240" ry="108"/>
              </clipPath>
            </defs>
            <circle cx="300" cy="300" r="275" fill="#F4F1EA" filter="url(#logo-vintageSoftGlow)"/>
            <ellipse cx="310" cy="435" rx="240" ry="108" fill="url(#logo-goldTubeGrad)"/>
            <g clip-path="url(#logo-tubeClip)">
              <ellipse cx="330" cy="368" rx="200" ry="52" fill="#FFF2CC" opacity="0.45"/>
            </g>
            <ellipse cx="305" cy="396" rx="125" ry="42" fill="#A87316"/>
            <ellipse cx="305" cy="400" rx="108" ry="32" fill="#6B4605"/>
            <ellipse cx="305" cy="394" rx="108" ry="26" fill="#8A5A0A" opacity="0.6"/>
            <g clip-path="url(#logo-tubeClip)">
              <path d="M 110,425 C 200,468 420,468 505,420" fill="none" stroke="#FFF7DF" stroke-width="34" stroke-linecap="round" opacity="0.5"/>
              <path d="M 92,412 C 150,505 470,508 530,408" fill="none" stroke="#8A5A0A" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" opacity="0.75"/>
            </g>
            <ellipse cx="195" cy="402" rx="65" ry="22" fill="#6B4605" opacity="0.35"/>
            <path d="M 142,412 C 110,340 120,230 215,195 C 270,172 268,115 210,102 L 242,122 C 290,140 295,210 240,245 C 185,280 190,360 248,414 Z" fill="url(#logo-goldNeckGrad)"/>
            <path d="M 154,395 C 132,325 142,240 220,205" fill="none" stroke="#FFF7DF" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
            <path d="M 132,130 C 132,95 162,73 197,73 C 232,73 257,100 255,135 C 253,170 227,193 195,193 C 162,193 132,165 132,130 Z" fill="url(#logo-goldTubeGrad)"/>
            <ellipse cx="169" cy="99" rx="26" ry="14" fill="#FFF2CC" opacity="0.7" transform="rotate(-18 169 99)"/>
            <ellipse cx="210" cy="89" rx="14" ry="8" fill="#FFF2CC" opacity="0.6" transform="rotate(-18 210 89)"/>
            <path d="M 147,173 C 167,187 197,193 222,185 C 207,197 167,197 147,173 Z" fill="#99690F" opacity="0.5"/>
            <path d="M 149,147 C 119,155 103,177 100,207 C 99,225 106,238 118,243 C 130,247 141,241 145,229 C 150,210 153,183 161,161 Z" fill="url(#logo-beakCream)"/>
            <path d="M 100,207 C 99,225 106,238 118,243 C 130,247 141,241 145,229 C 147,220 148,212 149,204 C 131,200 113,201 100,207 Z" fill="url(#logo-goldNeckGrad)"/>
            <path d="M 100,207 C 99,225 106,238 118,243 C 108,268 88,293 68,263 C 58,243 85,215 100,207 Z" fill="url(#logo-vintageCharcoal)"/>
            <circle cx="119" cy="221" r="3.5" fill="#8A8A8A" opacity="0.6"/>
            <circle cx="183" cy="117" r="23" fill="url(#logo-beakCream)"/>
            <circle cx="183" cy="117" r="17" fill="#ffffff"/>
            <circle cx="185" cy="118" r="10" fill="url(#logo-vintageCharcoal)"/>
            <circle cx="181" cy="114" r="3.5" fill="#ffffff"/>
          </svg>
        </div>
        <div class="brand-copy">
          <p class="eyebrow">Est. Frequency</p>
          <h1>Raadio</h1>
        </div>
      </header>

      <section class="dashboard-readout" aria-label="Dashboard readout">
        <div class="dashboard-plate">
          <div class="retro-indicators">
            <span class="indicator-dot"></span>
            <span class="indicator-dot"></span>
            <span class="indicator-dot"></span>
          </div>
          <p id="dashboard-text" class="dashboard-text">Ready to play</p>
        </div>
      </section>

      <section class="song-card" aria-label="Song information">
        <h2 id="song-name" class="song-name">Velvet Hour</h2>
        <p id="artist-name" class="artist-name">Live Stream</p>
      </section>

      <section class="wave-panel" aria-label="Playback progress">
        <canvas id="wave-bar"></canvas>
      </section>

      <div class="controls">
        <button type="button" id="play-pause-btn" class="neu-btn neu-btn--hero ripple-btn" aria-label="Play">
          <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l12-7z"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
        </button>
      </div>

      <button type="button" id="skip-btn" class="skip-vote ripple-btn" aria-label="Vote to skip">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-person"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <svg id="play-icon" viewBox="0 0 14 24" aria-hidden="true"><path d="M12 5v14l8-7z"/></svg>
        <svg id="play-icon" viewBox="0 0 14 24" aria-hidden="true"><path d="M-8 5v14l12-7z"/></svg>
      </button>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script src="script.js"></script>
</body>
